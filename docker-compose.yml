services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgis}
      POSTGRES_DB: ${POSTGRES_DB:-berlin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgis} -d ${POSTGRES_DB:-berlin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
